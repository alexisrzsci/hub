<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Alexis Hub">
<meta name="theme-color" content="#F3EFE4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1813" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Alexis Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===== Field-notebook design system ===== */
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%;display:block}
[hidden]{display:none!important}
*{box-sizing:border-box}
:root{
  --bg:#F3EFE4; --surface:#FBF9F3; --surface-2:#ECE6D6; --ink:#1C2A22; --muted:#5F6B60; --line:#DDD5C2;
  --accent:#2F5D45; --accent-ink:#F7F4EA; --accent-soft:#DCE6D8;
  --ochre:#9C650C; --ochre-soft:#F1E1BF; --terra:#A4442A; --terra-soft:#F2D8CC;
  --sky:#2C6A8F; --sky-soft:#D8E7EF; --moss:#56762E; --moss-soft:#E2EAD0; --plum:#79507A; --plum-soft:#ECDDEA;
  --topo:rgba(47,93,69,.13); --shadow:rgba(40,52,38,.45);
  --f-display:"Fraunces",Georgia,"Times New Roman",serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1813; --surface:#16221B; --surface-2:#1C2B23; --ink:#E7EADF; --muted:#9AA79A; --line:#2A3A31;
  --accent:#8CC5A0; --accent-ink:#0E1712; --accent-soft:#1F3428;
  --ochre:#E2AE55; --ochre-soft:#3A2C12; --terra:#EE8F6F; --terra-soft:#3D2119;
  --sky:#82B9DB; --sky-soft:#16303F; --moss:#AECB7E; --moss-soft:#26321A; --plum:#D2A6D2; --plum-soft:#352236;
  --topo:rgba(140,197,160,.10); --shadow:rgba(0,0,0,.9); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1813; --surface:#16221B; --surface-2:#1C2B23; --ink:#E7EADF; --muted:#9AA79A; --line:#2A3A31;
  --accent:#8CC5A0; --accent-ink:#0E1712; --accent-soft:#1F3428;
  --ochre:#E2AE55; --ochre-soft:#3A2C12; --terra:#EE8F6F; --terra-soft:#3D2119;
  --sky:#82B9DB; --sky-soft:#16303F; --moss:#AECB7E; --moss-soft:#26321A; --plum:#D2A6D2; --plum-soft:#352236;
  --topo:rgba(140,197,160,.10); --shadow:rgba(0,0,0,.9); color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header with contour lines */
header{position:sticky;top:0;z-index:5;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-left,0px)) 12px;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);overflow:hidden;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
header .topo{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
header .topo path{fill:none;stroke:var(--topo);stroke-width:1.1}
.brand{position:relative;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand h1{font:700 25px/1.05 var(--f-display);margin:0;letter-spacing:-.015em;font-variation-settings:"opsz" 96}
.brand h1 span{color:var(--accent)}
.date{font:500 11px/1.35 var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;text-align:right}

/* bottom navigation */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px max(10px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px))}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.nav button{position:relative;border:0;background:transparent;color:var(--muted);display:grid;justify-items:center;gap:2px;padding:6px 4px;border-radius:12px;cursor:pointer;font:500 11px var(--f-body);letter-spacing:.01em;transition:color .2s,background .2s}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}
.nav .badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 5px;border-radius:99px;background:var(--terra);color:#fff;font:600 10px/17px var(--f-mono);text-align:center}

main{display:grid;gap:22px;padding-top:14px}
section{display:grid;gap:8px}
h2{font:500 11px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:6px 2px 2px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2 small{font:400 11px var(--f-mono);text-transform:none;letter-spacing:0}
h2 .h-link{border:0;background:none;color:var(--accent);font:500 12px var(--f-body);text-transform:none;letter-spacing:0;cursor:pointer;padding:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 14px 30px -28px var(--shadow)}
.none{color:var(--muted);font-size:14px;padding:11px 14px;background:var(--surface);border:1px dashed var(--line);border-radius:14px;margin:0}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:22px 18px;display:grid;gap:6px}
.empty b{font:600 19px/1.3 var(--f-display)}
.empty p{margin:0;color:var(--muted)}
footer{color:var(--muted);font:400 11px var(--f-mono);text-align:center;padding-top:14px;letter-spacing:.03em}

/* course / tone colour tokens */
.c-forest{--c:var(--accent);--c-soft:var(--accent-soft)}
.c-ochre{--c:var(--ochre);--c-soft:var(--ochre-soft)}
.c-sky{--c:var(--sky);--c-soft:var(--sky-soft)}
.c-terra{--c:var(--terra);--c-soft:var(--terra-soft)}
.c-moss{--c:var(--moss);--c-soft:var(--moss-soft)}
.c-plum{--c:var(--plum);--c-soft:var(--plum-soft)}

/* hero scene: NDVI-style mosaic */
.scene{position:relative;overflow:hidden;border-radius:20px;min-height:160px;padding:18px;display:grid;align-content:end;gap:6px;background:#1E3A2B;color:#F4F1E6;box-shadow:0 20px 40px -28px var(--shadow)}
.scene canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.scene::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(9,18,13,.9) 0%,rgba(9,18,13,.72) 60%,rgba(9,18,13,.3) 100%)}
.scene>*:not(canvas){position:relative;z-index:1}
.scene .k{font:500 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;opacity:.82;display:flex;align-items:center;gap:8px}
.scene .big{font:600 25px/1.15 var(--f-display);letter-spacing:-.01em;text-wrap:balance;margin:0}
.scene .sub{font-size:14px;margin:0;max-width:36ch;text-shadow:0 1px 8px rgba(0,0,0,.55)}
.scene .row-end{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px}
.scene .upd{font:400 11px var(--f-mono);opacity:.75;letter-spacing:.03em}
.refresh{border:1px solid rgba(244,241,230,.35);background:rgba(244,241,230,.08);color:inherit;border-radius:99px;padding:5px 11px;font:500 12px var(--f-body);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.refresh svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.refresh.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{width:9px;height:9px;border-radius:50%;background:#8FE0AE}
.pulse.on{background:#F2BA55;box-shadow:0 0 0 0 rgba(242,186,85,.7);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(242,186,85,0)}100%{box-shadow:0 0 0 0 rgba(242,186,85,0)}}

/* weather */
.wx{padding:16px;display:grid;gap:12px}
.wx .top{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.wx .ico{width:46px;height:46px;color:var(--ochre)}
.wx .ico svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.wx .temp{font:600 40px/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.wx .cond{font-weight:600}
.wx .hl{color:var(--muted);font:400 12px var(--f-mono)}
.wx .place{font:500 11px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;text-align:right}
.gauges{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.gauge{border-radius:12px;padding:9px 11px;background:var(--c-soft);color:var(--c);display:grid;gap:1px}
.gauge .gk{font:500 10px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;opacity:.85}
.gauge .gv{font:600 15px/1.25 var(--f-body)}
.gauge .gs{font:400 11px var(--f-mono);opacity:.85}
.wx .sun{display:flex;justify-content:space-between;color:var(--muted);font:400 11px var(--f-mono)}

/* countdown hero */
.hero{border-radius:18px;padding:16px 18px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;background:var(--accent);color:var(--accent-ink);box-shadow:0 18px 40px -26px var(--shadow)}
.hero.hot{background:var(--terra);color:#fff}
.hero.ochre{background:var(--ochre);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero.hot,:root:not([data-theme="light"]) .hero.ochre{color:#1A0F0B}}
:root[data-theme="dark"] .hero.hot,:root[data-theme="dark"] .hero.ochre{color:#1A0F0B}
.hero .k{font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.09em;opacity:.85}
.hero .t{font:600 19px/1.25 var(--f-display);margin:3px 0;text-wrap:balance}
.hero .d{font-size:13px;opacity:.9}
.ring{position:relative;width:84px;height:84px;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .trk{stroke:currentColor;opacity:.22}
.ring .val{stroke:currentColor;stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.2,.9,.2,1)}
.ring .num{font:700 30px/1 var(--f-display);text-align:center;font-variant-numeric:tabular-nums}
.ring .unit{display:block;font:500 9px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;margin-top:3px;opacity:.85}

/* specimen-label lists */
ul.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 14px 30px -28px var(--shadow)}
ul.list>li{position:relative;border-top:1px solid var(--line);overflow:hidden}
ul.list>li:first-child{border-top:0}
.row{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:12px 14px;background:var(--surface);transition:transform .25s cubic-bezier(.2,.9,.2,1)}
.row.tone-hot::before,.row.tone-warn::before,.row.tone-c::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--terra)}
.row.tone-warn::before{background:var(--ochre)}
.row.tone-c::before{background:var(--c)}
.sw-bg{position:absolute;inset:0;background:var(--moss-soft);color:var(--moss);display:flex;align-items:center;padding-left:18px;font:600 13px var(--f-body);gap:6px}
li.swipe-ok .sw-bg{background:var(--moss);color:#fff}
li[data-swipe] .row{touch-action:pan-y}
.body{min-width:0;display:grid;gap:2px}
.label{font:500 10px/1.3 var(--f-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--c,var(--muted))}
.title{font-weight:600;margin:0;overflow-wrap:anywhere}
.sub{color:var(--muted);font-size:13px;margin:0;overflow-wrap:anywhere}
.mono{font-family:var(--f-mono);font-size:12px}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font:500 10.5px/1.7 var(--f-mono);padding:0 7px;border-radius:6px;background:var(--c-soft,var(--accent-soft));color:var(--c,var(--accent));white-space:nowrap}
.chip.new{background:var(--ochre-soft);color:var(--ochre)}
.chip.src{background:transparent;color:var(--muted);border:1px solid var(--line)}
.pill{font:500 11.5px/1 var(--f-mono);padding:6px 9px;border-radius:99px;white-space:nowrap;background:var(--moss-soft);color:var(--moss);font-variant-numeric:tabular-nums}
.pill.hot{background:var(--terra-soft);color:var(--terra)}
.pill.warn{background:var(--ochre-soft);color:var(--ochre)}
.pill.muted{background:var(--surface-2);color:var(--muted)}
.check{position:relative;width:24px;height:24px;margin-top:1px;cursor:pointer}
.check input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.check span{position:absolute;inset:0;border:2px solid var(--line);border-radius:7px;background:var(--surface);transition:background .15s,border-color .15s}
.check input:checked+span{background:var(--moss);border-color:var(--moss)}
.check input:checked+span::after{content:"";position:absolute;left:7px;top:3px;width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.check input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
li.is-done .title{text-decoration:line-through;color:var(--muted)}
li.is-done .pill{opacity:.55}
.icon{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--c-soft,var(--ochre-soft));color:var(--c,var(--ochre));font:600 13px var(--f-mono)}
.icon.ev{background:var(--accent-soft);color:var(--accent)}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.btn{font:500 13px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:6px 11px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.btn[aria-pressed="true"],.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{color:var(--muted)}
.btn.sm{font-size:12px;padding:4px 9px}
details.more summary{cursor:pointer;color:var(--muted);font-size:13px;padding:4px 2px;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary{margin-bottom:8px}
.progress{display:grid;gap:6px}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--moss);border-radius:99px;transition:width .4s}
.progress .lbl{font:400 12px var(--f-mono);color:var(--muted)}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;font:500 13px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;padding:6px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.filters button i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted))}
.filters button[aria-pressed="true"]{border-color:var(--c,var(--accent));color:var(--c,var(--accent));background:var(--c-soft,var(--accent-soft))}

/* week strip */
.week{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 6*6px)/7);gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:2px}
.week::-webkit-scrollbar{display:none}
.day{scroll-snap-align:start;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 0 8px;display:grid;justify-items:center;gap:3px;cursor:pointer;min-height:66px}
.day .dw{font:500 10px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.day .dn{font:600 17px/1 var(--f-display);font-variant-numeric:tabular-nums}
.day .dots{display:flex;gap:3px;min-height:6px}
.day .dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.day.today{border-color:var(--accent)}
.day.today .dw{color:var(--accent)}
.day.wknd{background:var(--surface-2)}
.day[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day[aria-pressed="true"] .dw{color:var(--accent-ink)}
.daygroup{font:500 11px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:6px 2px -2px}

/* field notes */
.notes{display:grid;gap:10px}
.species{display:grid;grid-template-columns:104px 1fr;overflow:hidden}
.species .ph{background:var(--surface-2);min-height:120px;position:relative}
.species .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.species .tx{padding:12px 14px;display:grid;gap:3px;align-content:start}
.species .nm{font:600 18px/1.2 var(--f-display);margin:0}
.species .sci{font:italic 400 13px var(--f-display);color:var(--muted);margin:0}
.earth{padding:12px 14px;display:grid;gap:8px}
.earth .ev{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.credit{font:400 10.5px var(--f-mono);color:var(--muted)}

/* word & flashcards */
.word{width:100%;text-align:left;cursor:pointer;perspective:900px;padding:0;border:0;background:transparent;font:inherit;color:inherit}
.word .flip{display:grid;transition:transform .6s cubic-bezier(.2,.9,.2,1);transform-style:preserve-3d}
.word.flipped .flip{transform:rotateY(180deg)}
.word .face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;padding:18px;display:grid;gap:6px;align-content:center;min-height:124px;border:1px solid var(--line);background:var(--surface);box-shadow:0 14px 30px -28px var(--shadow)}
.word .back{transform:rotateY(180deg);background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.word .term{font:600 26px/1.15 var(--f-display);letter-spacing:-.01em}
.word .hint{font:400 11px var(--f-mono);color:var(--muted)}
.word .ex{opacity:.85;font-style:italic;margin-top:4px}
.deckbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px}
.deckbar b{font:600 22px/1 var(--f-display)}
.review{display:grid;gap:10px}
.review .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.review .btns button{padding:11px;border-radius:12px;border:1px solid var(--line);font:600 14px var(--f-body);cursor:pointer;background:var(--surface)}
.review .btns .again{color:var(--terra);background:var(--terra-soft);border-color:transparent}
.review .btns .good{color:var(--moss);background:var(--moss-soft);border-color:transparent}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font:600 26px/1 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font:400 10.5px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

/* job pipeline board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,72%);gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:4px}
.board::-webkit-scrollbar{display:none}
.col{scroll-snap-align:start;background:var(--surface-2);border-radius:14px;padding:10px;display:grid;gap:8px;align-content:start;min-height:120px}
.col h3{margin:0 2px;font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--c);display:flex;justify-content:space-between}
.jc{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:9px 10px;display:grid;gap:3px}
.jc .title{font-size:14px}
.jc .actions{margin-top:4px}
.col .none{font-size:12.5px;padding:8px 10px}
.match{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-top:4px}
.match .bar i{background:var(--c,var(--moss))}
.match span{font:500 11px var(--f-mono);color:var(--muted)}

/* me: forms, phases, hours */
.panel{padding:14px;display:grid;gap:12px}
.form{display:grid;grid-template-columns:1fr auto;gap:8px}
.form.three{grid-template-columns:1fr 1fr auto}
.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;font:400 14px var(--f-body);color:var(--ink);min-width:0}
.phases{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.phases li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:6px 2px}
.phases li.is-done span.t{text-decoration:line-through;color:var(--muted)}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:4px 6px;border-radius:6px}
.big-num{font:600 34px/1 var(--f-display);font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv>div{display:grid;gap:2px}
.kv span{font:400 10.5px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kv b{font:600 22px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.review-week{padding:16px;display:grid;gap:12px;background:linear-gradient(160deg,var(--accent-soft),var(--surface) 70%)}
.review-week h3{margin:0;font:600 20px/1.2 var(--f-display)}
.review-week ul{margin:0;padding-left:18px;display:grid;gap:3px;font-size:14px}
.seg{display:inline-grid;grid-auto-flow:column;gap:4px;background:var(--surface-2);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 12px;cursor:pointer;font:500 13px var(--f-body);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* skeleton + offline */
.sk{border-radius:16px;background:linear-gradient(100deg,var(--surface-2) 30%,var(--surface) 50%,var(--surface-2) 70%);background-size:300% 100%;animation:sk 1.4s ease-in-out infinite}
@keyframes sk{from{background-position:100% 0}to{background-position:0 0}}
.offline{font:500 12px var(--f-mono);color:var(--ochre);background:var(--ochre-soft);border-radius:10px;padding:8px 12px}

/* entrance */
main.intro>*{animation:rise .55s cubic-bezier(.2,.9,.2,1) both}
main.intro>*:nth-child(2){animation-delay:.04s}
main.intro>*:nth-child(3){animation-delay:.08s}
main.intro>*:nth-child(n+4){animation-delay:.12s}
@keyframes rise{from{opacity:.3;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* lock screen */
.lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.lock form{width:100%;max-width:360px;display:grid;gap:12px}
.lock h2{font:700 30px/1.1 var(--f-display);color:var(--ink);text-transform:none;letter-spacing:-.01em;margin:0;display:block}
.lock p{margin:0;color:var(--muted)}
.lock input{font:500 16px var(--f-mono);padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.lock button{font:600 15px var(--f-body);padding:12px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.lock .err{color:var(--terra);font-size:13px;min-height:1em}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <svg class="topo" id="topo" aria-hidden="true" preserveAspectRatio="none"></svg>
    <div class="brand">
      <h1>Alexis <span>Hub</span></h1>
      <div class="date" id="date"></div>
    </div>
  </header>
  <main id="main" aria-live="polite">
    <div class="sk" style="height:170px"></div>
    <div class="sk" style="height:150px"></div>
    <div class="sk" style="height:100px"></div>
  </main>
  <footer id="foot"></footer>
</div>

<nav class="nav" aria-label="Sections">
  <div class="in" role="tablist">
    <button role="tab" data-tab="today" aria-selected="true"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Today<span class="badge" id="b-today" hidden></span></button>
    <button role="tab" data-tab="uni" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/><path d="M9 7h7M9 11h5"/></svg>Uni<span class="badge" id="b-uni" hidden></span></button>
    <button role="tab" data-tab="jobs" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/></svg>Jobs<span class="badge" id="b-jobs" hidden></span></button>
    <button role="tab" data-tab="me" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22c4-3 7-7.5 7-12a7 7 0 0 0-14 0c0 4.5 3 9 7 12z"/><path d="M12 6v8M9 11l3 3 3-3"/></svg>Me<span class="badge" id="b-me" hidden></span></button>
  </div>
</nav>

<div class="lock" id="lock" hidden>
  <form id="lock-form" autocomplete="off">
    <h2>Alexis Hub</h2>
    <p>Enter your key to unlock your board on this device. You only need to do this once.</p>
    <label for="key" style="position:absolute;left:-9999px">Key</label>
    <input id="key" type="password" placeholder="Your key" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button type="submit">Unlock</button>
    <p class="err" id="lock-err"></p>
  </form>
</div>
<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^https?:\/\//i.test(String(u||"")) ? esc(u) : "";
const slug = s => String(s||"").replace(/[^A-Za-z0-9_-]/g,"_").slice(0,80);
const LS = {
  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
const HOME = {lat:37.98, lon:-1.13, name:"Murcia"};
const DAY = 864e5;

/* ---------- state ---------- */
let daily = null, jobs = null, loaded = false, offline = false;
let marks = Object.assign({done:{}, saved:{}, hidden:{}, starred:{}, dismissed:{}, stage:{}, stageAt:{}, snap:{}}, LS.get("fd-marks", {}));
const DEFAULT_ME = {
  countdowns:[{id:"spaceapps", title:"NASA Space Apps Challenge", date:"2026-11-14T09:00:00+01:00"}],
  tfg:{phases:["Topic & registration","Literature review","Sentinel-2 data download","Pre-processing","Analysis & indices","Results & figures","Writing","Defence"].map((t,i)=>({id:"p"+i, t, done:false}))},
  beca:{target:null, log:[]}
};
let me = Object.assign({}, DEFAULT_ME, LS.get("fd-me", {}));
if(!Array.isArray(me.countdowns)) me.countdowns = DEFAULT_ME.countdowns;
if(!me.tfg || !Array.isArray(me.tfg.phases)) me.tfg = DEFAULT_ME.tfg;
me.beca = Object.assign({target:null, log:[]}, me.beca || {});
if(!Array.isArray(me.beca.log)) me.beca.log = [];
let cards = Object.assign({words:{}, reviews:[]}, LS.get("fd-cards", {}));
let env = LS.get("fd-env", {});
let nature = LS.get("fd-nature", {});
let tab = LS.get("fd-tab2", "today");
if (["#today","#uni","#jobs","#me"].includes(location.hash)) tab = location.hash.slice(1);
let uniCourse = "all", uniDay = null, jobFilter = "fits";
let rev = null; // flashcard review session
const saveMarks = () => LS.set("fd-marks", marks), saveMe = () => LS.set("fd-me", me), saveCards = () => LS.set("fd-cards", cards);

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2,"0");
const keyOf = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const todayKey = () => keyOf(new Date());
function dueDate(d){ if(!d) return null; const s=String(d); const t = s.includes("T") ? new Date(s) : new Date(s+"T23:59:00"); return isNaN(t) ? null : t; }
function msUntil(d){ const t=dueDate(d); return t ? t - Date.now() : null; }
function rel(ms){ if(ms==null) return "no date"; if(ms<0) return "overdue"; const h=ms/36e5; if(h<24) return "in "+Math.max(1,Math.round(h))+" h"; const d=Math.round(h/24); return d===1 ? "tomorrow" : "in "+d+" days"; }
function ago(t){ const m=Math.round((Date.now()-t)/6e4); if(m<1) return "just now"; if(m<60) return m+" min ago"; const h=Math.round(m/60); if(h<24) return h+" h ago"; const d=Math.round(h/24); return d===1?"yesterday":d+" days ago"; }
function tone(ms){ if(ms==null) return "calm"; if(ms<48*36e5) return "hot"; if(ms<7*DAY) return "warn"; return "calm"; }
function fmtDue(d){ const t=dueDate(d); if(!t) return esc(d||""); let s=t.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"}); if(String(d).includes("T")) s+=" · "+t.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}); return s; }
function doy(dt){ return Math.floor((dt - new Date(dt.getFullYear(),0,0))/DAY); }
function daysSince(first){ if(!first) return null; const t=new Date(String(first).slice(0,10)+"T12:00:00"); if(isNaN(t)) return null; return Math.round((new Date(todayKey()+"T12:00:00")-t)/DAY); }
function weekStart(){ const n=new Date(); const d=(n.getDay()+6)%7; const s=new Date(n.getFullYear(), n.getMonth(), n.getDate()-d); return s.getTime(); }
const ts = v => typeof v === "number" ? v : 0;
function ageChip(first){ const d = daysSince(first); if(d==null) return ""; if(d<=0) return `<span class="chip new">New</span>`; return `<span class="chip src">${d===1?"yesterday":d+"d ago"}</span>`; }
function greeting(){ const h=new Date().getHours(); return h<5?"Late night, Alexis":h<12?"Good morning, Alexis":h<20?"Good afternoon, Alexis":"Good evening, Alexis"; }

/* ---------- colours per course ---------- */
const TONES = ["forest","ochre","sky","terra","moss","plum"];
function courseTone(c){ if(!c) return "forest"; let h=7; for(const ch of String(c).toLowerCase()) h=(h*31+ch.charCodeAt(0))>>>0; return TONES[h%TONES.length]; }

/* ---------- marks ---------- */
function flip(kind, id){
  const m = marks[kind] || (marks[kind] = {});
  if(m[id]) delete m[id]; else { m[id] = Date.now(); if(kind==="done" && navigator.vibrate) try{navigator.vibrate(12);}catch(_){} }
  saveMarks(); render();
}
const on = (kind,id) => !!(marks[kind] && marks[kind][id]);

/* ---------- small pieces ---------- */
const none = t => `<p class="none">${esc(t)}</p>`;
const emptyState = (t, p) => `<div class="empty"><b>${esc(t)}</b><p>${esc(p)}</p></div>`;
function li(inner, {cls="", rowCls="", swipe=null, tone:tc=""}={}){
  return `<li class="${cls} ${tc}"${swipe?` data-swipe="${esc(swipe)}"`:""}>${swipe?`<div class="sw-bg">✓ Done</div>`:""}<div class="row ${rowCls}">${inner}</div></li>`;
}
function checkbox(kind, id, label){
  return `<label class="check"><input type="checkbox" data-mark="${kind}" data-id="${esc(id)}" ${on(kind,id)?"checked":""} aria-label="${esc(label)}"><span></span></label>`;
}
const dlId = x => "d:"+(x.id||slug((x.course||"")+x.title+x.due));
function deadlineRow(x){
  const id = dlId(x), ms = msUntil(x.due), t = tone(ms), done = on("done", id), c = courseTone(x.course);
  const inner = `${checkbox("done", id, "Mark "+(x.title||"deadline")+" as done")}
    <div class="body">
      <div class="meta">${x.course?`<span class="label">${esc(x.course)}</span>`:""}${ageChip(x.firstSeen)}</div>
      <p class="title">${esc(x.title)}</p>
      <p class="sub mono">${fmtDue(x.due)}${x.note?" · "+esc(x.note):""}</p>
    </div>
    <span class="pill ${done?"muted":t==="calm"?"":t}">${done?"done":esc(rel(ms))}</span>`;
  return li(inner, {cls:(done?"is-done ":"")+"c-"+c, rowCls: done?"":(t==="calm"?"tone-c":"tone-"+t), swipe: done?null:id});
}
function allDeadlines(){
  return (daily && daily.deadlines || []).map(x => ({...x, _id:dlId(x), _ms: msUntil(x.due)}))
    .filter(x => on("done", x._id) ? (x._ms==null || x._ms > -DAY) : (x._ms==null || x._ms > -7*DAY))
    .sort((a,b) => (a._ms ?? 1e15) - (b._ms ?? 1e15));
}
function ringHero(title, kicker, when, ms, horizon, cls){
  const hrs = ms!=null ? ms/36e5 : null;
  const num = hrs==null ? "–" : hrs < 48 ? Math.max(0,Math.round(hrs)) : Math.round(hrs/24);
  const unit = hrs==null ? "" : hrs < 48 ? "hours" : "days";
  const frac = ms==null ? 0 : Math.max(0, Math.min(1, ms/horizon));
  const C = 2*Math.PI*36;
  return `<div class="hero ${cls||""}"><div class="ring"><svg viewBox="0 0 84 84" aria-hidden="true"><circle class="trk" cx="42" cy="42" r="36" fill="none" stroke-width="6"/><circle class="val" cx="42" cy="42" r="36" fill="none" stroke-width="6" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-frac)).toFixed(1)}"/></svg><div class="num">${num}<span class="unit">${unit}</span></div></div>
    <div><div class="k">${kicker}</div><div class="t">${esc(title)}</div><div class="d">${when}</div></div></div>`;
}

/* ---------- weather & environment ---------- */
const ICONS = {
  sun:'<circle cx="24" cy="24" r="8"/><path d="M24 6v5M24 37v5M11.3 11.3l3.5 3.5M33.2 33.2l3.5 3.5M6 24h5M37 24h5M11.3 36.7l3.5-3.5M33.2 14.8l3.5-3.5"/>',
  moon:'<path d="M31 8a14 14 0 1 0 9 22A12 12 0 0 1 31 8z"/>',
  partly:'<circle cx="18" cy="17" r="6"/><path d="M18 5v3M8 17H5M10.2 9.2l2 2M25.8 9.2l-2 2"/><path d="M16 38h18a7 7 0 0 0 0-14 9 9 0 0 0-17 2 6 6 0 0 0-1 12z"/>',
  cloud:'<path d="M14 36h20a8 8 0 0 0 0-16 10 10 0 0 0-19 2.5A7 7 0 0 0 14 36z"/>',
  rain:'<path d="M14 30h20a8 8 0 0 0 0-16 10 10 0 0 0-19 2.5A7 7 0 0 0 14 30z"/><path d="M17 35l-2 5M25 35l-2 5M33 35l-2 5"/>',
  storm:'<path d="M14 28h20a8 8 0 0 0 0-16 10 10 0 0 0-19 2.5A7 7 0 0 0 14 28z"/><path d="M25 30l-4 7h6l-4 7"/>',
  fog:'<path d="M8 18h32M6 25h36M10 32h28M14 39h20"/>',
  snow:'<path d="M14 30h20a8 8 0 0 0 0-16 10 10 0 0 0-19 2.5A7 7 0 0 0 14 30z"/><path d="M17 36v4M15 38h4M29 36v4M27 38h4"/>'
};
function wmo(code, isDay){
  const c = Number(code);
  if(c===0) return [isDay?"sun":"moon", "Clear sky"];
  if(c===1) return [isDay?"sun":"moon", "Mostly clear"];
  if(c===2) return ["partly", "Partly cloudy"];
  if(c===3) return ["cloud", "Overcast"];
  if(c===45||c===48) return ["fog", "Fog"];
  if(c>=51&&c<=57) return ["rain", "Drizzle"];
  if(c>=61&&c<=67) return ["rain", "Rain"];
  if(c>=71&&c<=77) return ["snow", "Snow"];
  if(c>=80&&c<=82) return ["rain", "Showers"];
  if(c===85||c===86) return ["snow", "Snow showers"];
  if(c>=95) return ["storm", "Thunderstorm"];
  return ["cloud", "—"];
}
function uvLevel(u){ if(u==null) return ["—","forest"]; if(u<3) return ["Low","moss"]; if(u<6) return ["Moderate","ochre"]; if(u<8) return ["High","terra"]; if(u<11) return ["Very high","terra"]; return ["Extreme","plum"]; }
function aqiLevel(a){ if(a==null) return ["—","forest"]; if(a<=20) return ["Good","moss"]; if(a<=40) return ["Fair","moss"]; if(a<=60) return ["Moderate","ochre"]; if(a<=80) return ["Poor","terra"]; if(a<=100) return ["Very poor","terra"]; return ["Extremely poor","plum"]; }
// Angström fire-weather index: I = RH/20 + (27 - T)/10 (lower = more fire-prone)
function fireLevel(t, rh){ if(t==null||rh==null) return [null,"—","forest"]; const i = rh/20 + (27-t)/10; const v=Math.round(i*10)/10;
  if(i>4) return [v,"Very low","moss"]; if(i>2.5) return [v,"Low","moss"]; if(i>2) return [v,"High","ochre"]; return [v,"Very high","terra"]; }
async function getJSON(u){ const r = await fetch(u, {cache:"no-store"}); if(!r.ok) throw new Error("http "+r.status); return r.json(); }
async function fetchEnv(force){
  if(!force && env.ts && Date.now()-env.ts < 30*6e4) return;
  const q = `latitude=${HOME.lat}&longitude=${HOME.lon}&timezone=Europe%2FMadrid`;
  const [w, a] = await Promise.allSettled([
    getJSON(`https://api.open-meteo.com/v1/forecast?${q}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,is_day&daily=temperature_2m_max,temperature_2m_min,uv_index_max,precipitation_probability_max,sunrise,sunset&forecast_days=1`),
    getJSON(`https://air-quality-api.open-meteo.com/v1/air-quality?${q}&current=european_aqi,pm2_5,pm10`)
  ]);
  if(w.status==="fulfilled") env.weather = w.value;
  if(a.status==="fulfilled") env.air = a.value;
  if(w.status==="fulfilled" || a.status==="fulfilled"){ env.ts = Date.now(); LS.set("fd-env", env); }
}
// NASA Worldview link centred on an EONET event, on the event's date
function worldviewUrl(geo, cat){
  let pts = [];
  const c = geo && geo.coordinates;
  if(Array.isArray(c)){
    if(typeof c[0] === "number") pts = [c];
    else (function walk(a){ for(const x of a){ if(typeof x[0] === "number") pts.push(x); else walk(x); } })(c);
  }
  if(!pts.length) return "https://worldview.earthdata.nasa.gov/";
  const lons = pts.map(p => p[0]), lats = pts.map(p => p[1]), m = 2.5;
  const box = [Math.min(...lons)-m, Math.min(...lats)-m, Math.max(...lons)+m, Math.max(...lats)+m].map(v => v.toFixed(2)).join(",");
  const day = String(geo.date || "").slice(0,10);
  const layers = "MODIS_Terra_CorrectedReflectance_TrueColor,VIIRS_SNPP_CorrectedReflectance_TrueColor(hidden),Coastlines_15m,Reference_Labels_15m" + (/fire/i.test(cat) ? ",VIIRS_NOAA20_Thermal_Anomalies_375m_All" : "");
  return "https://worldview.earthdata.nasa.gov/?v=" + box + "&l=" + layers + (day ? "&t=" + day + "-T12:00:00Z" : "");
}
function seeded(str){ let h=2166136261; for(const c of str) h=Math.imul(h^c.charCodeAt(0),16777619); return (h>>>0); }
async function fetchNature(force){
  const day = todayKey(), jobsP = [];
  if(force || !nature.species || nature.species.day !== day){
    jobsP.push(getJSON(`https://api.inaturalist.org/v1/observations?lat=${HOME.lat}&lng=${HOME.lon}&radius=60&photos=true&quality_grade=research&per_page=80&order=desc&order_by=observed_on&locale=en`).then(j => {
      const seen = new Set();
      const pool = (j.results||[]).filter(o => o.taxon && o.photos && o.photos.length && !seen.has(o.taxon.id) && seen.add(o.taxon.id));
      if(!pool.length) return;
      const o = pool[seeded(day) % pool.length], tx = o.taxon;
      nature.species = {day, name: tx.preferred_common_name || tx.name, sci: tx.name, group: tx.iconic_taxon_name || "",
        photo: String(o.photos[0].url||"").replace("square","medium"), place: o.place_guess || "", date: o.observed_on || "",
        url: o.uri || ("https://www.inaturalist.org/observations/"+o.id), by: (o.user && o.user.login) || ""};
    }));
  }
  if(force || !nature.earth || nature.earth.v !== 2 || Date.now() - nature.earth.ts > 3*36e5){
    jobsP.push(getJSON("https://eonet.gsfc.nasa.gov/api/v3/events?status=open&limit=40&days=20").then(j => {
      const evs = (j.events||[]).map(e => {
        const geo = (e.geometry||[]).slice().sort((a,b) => String(a.date).localeCompare(String(b.date))).pop() || {};
        const cat = (e.categories&&e.categories[0]&&e.categories[0].title) || "Event";
        return {title: e.title, cat, date: geo.date || "", url: worldviewUrl(geo, cat)};
      }).sort((a,b) => String(b.date).localeCompare(String(a.date))).slice(0,3);
      nature.earth = {ts: Date.now(), v: 2, events: evs};
    }));
  }
  if(!jobsP.length) return;
  await Promise.allSettled(jobsP);
  LS.set("fd-nature", nature);
}
function weatherCard(){
  const w = env.weather, a = env.air;
  if(!w || !w.current) return `<div class="card wx"><div class="sk" style="height:46px"></div><div class="gauges"><div class="sk" style="height:52px"></div><div class="sk" style="height:52px"></div></div></div>`;
  const c = w.current, d = w.daily || {};
  const [ico, cond] = wmo(c.weather_code, c.is_day);
  const uv = d.uv_index_max ? d.uv_index_max[0] : null, [uvL, uvT] = uvLevel(uv);
  const aqi = a && a.current ? a.current.european_aqi : null, [aqL, aqT] = aqiLevel(aqi);

/* ---------- flashcards (spaced repetition) ---------- */
const BOX_DAYS = [0,1,3,7,14,30,60];
function syncWords(){
  if(!daily) return;
  const list = [...(daily.wordsHistory||[])];
  if(daily.word && daily.word.term) list.push({...daily.word, date: daily.word.date || daily.date});
  let changed = false;
  for(const w of list){
    if(!w || !w.term) continue;
    const k = w.term.toLowerCase();
    if(!cards.words[k]){ cards.words[k] = {term:w.term, definition:w.definition||"", example:w.example||"", added:w.date||todayKey(), box:0, due:todayKey()}; changed = true; }
  }
  if(changed) saveCards();
}
const dueCards = () => Object.values(cards.words).filter(c => c.due <= todayKey());
function startReview(){ const q = dueCards().sort(() => Math.random()-.5); rev = {q, i:0, shown:false, done:0}; tab="me"; render(); }
function grade(ok){
  const c = rev && rev.q[rev.i]; if(!c) return;
  const w = cards.words[c.term.toLowerCase()];
  w.box = ok ? Math.min(BOX_DAYS.length-1, w.box+1) : 0;
  const n = new Date(); n.setDate(n.getDate() + (ok ? BOX_DAYS[w.box] : 0));
  w.due = ok ? keyOf(n) : todayKey();
  if(!ok) rev.q.push(c);
  cards.reviews.push(Date.now()); if(cards.reviews.length>500) cards.reviews = cards.reviews.slice(-500);
  saveCards(); rev.i++; rev.shown=false; rev.done++; render();
}

/* ---------- UNI ---------- */
function renderUni(){
  if(!daily) return loaded ? emptyState("No UMU board yet", "The hourly pass fills this tab with deadlines, changes and opportunities from your UMU email.") : `<div class="sk" style="height:90px"></div><div class="sk" style="height:220px"></div>`;
  const all = allDeadlines();
  const courses = [...new Set([...all.map(x=>x.course), ...(daily.updates||[]).map(x=>x.course)].filter(Boolean))];
  const byCourse = x => uniCourse==="all" || x.course===uniCourse;
  let h = "";
  if(courses.length) h += `<div class="filters" role="group" aria-label="Filter by course"><button data-course="all" aria-pressed="${uniCourse==="all"}">All</button>${courses.map(c=>`<button class="c-${courseTone(c)}" data-course="${esc(c)}" aria-pressed="${uniCourse===c}"><i></i>${esc(c)}</button>`).join("")}</div>`;

  // two-week strip
  const start = new Date(); start.setHours(0,0,0,0);
  let wk = "";
  for(let i=0;i<14;i++){
    const d = new Date(start); d.setDate(start.getDate()+i); const k = keyOf(d);
    const dots = all.filter(x => byCourse(x) && !on("done",x._id) && x.due && keyOf(dueDate(x.due))===k).slice(0,4).map(x=>`<i class="c-${courseTone(x.course)}"></i>`).join("");
    wk += `<button class="day ${i===0?"today":""} ${[0,6].includes(d.getDay())?"wknd":""}" data-day="${k}" aria-pressed="${uniDay===k}" aria-label="${d.toDateString()}"><span class="dw">${d.toLocaleDateString("en-GB",{weekday:"short"}).slice(0,3)}</span><span class="dn">${d.getDate()}</span><span class="dots">${dots}</span></button>`;
  }
  h += `<section><h2>Next two weeks ${uniDay?`<button class="h-link" data-day="${uniDay}">Show all</button>`:""}</h2><div class="week">${wk}</div></section>`;

  const open = all.filter(x => !on("done",x._id) && byCourse(x) && (!uniDay || (x.due && keyOf(dueDate(x.due))===uniDay)));
  const closed = all.filter(x => on("done",x._id) && byCourse(x));
  const total = all.filter(byCourse).length;
  h += `<section><h2>Deadlines <small>${open.length} open · swipe right to finish</small></h2>`;
  if(total){
    const groups = {};
    for(const x of open){ const k = x.due ? keyOf(dueDate(x.due)) : "zz"; (groups[k] = groups[k] || []).push(x); }
    h += Object.keys(groups).sort().map(k => `<div class="daygroup">${k==="zz"?"No date":new Date(k+"T12:00:00").toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"})}</div><ul class="list">${groups[k].map(deadlineRow).join("")}</ul>`).join("") || none(uniDay ? "Nothing due that day." : "All caught up.");
    h += `<div class="progress"><div class="bar"><i style="width:${Math.round(100*closed.length/total)}%"></i></div><div class="lbl">${closed.length} of ${total} done</div></div>`;
    if(closed.length) h += `<details class="more"><summary>Show ${closed.length} done</summary><ul class="list">${closed.map(deadlineRow).join("")}</ul></details>`;
  } else h += none("No deadlines on the board.");
  h += `</section>`;

  const changes = daily.changes || [];
  h += `<section><h2>Changes <small>last 7 days</small></h2>${changes.length ? `<ul class="list">${changes.map(changeRow).join("")}</ul>` : none("No room or schedule changes.")}</section>`;
  const ups = (daily.updates || []).filter(byCourse);
  if(ups.length) h += `<section><h2>From UMU</h2><ul class="list">${ups.map(x=>li(`<span class="icon ev" aria-hidden="true">i</span><div class="body"><div class="meta">${x.kind?`<span class="label">${esc(x.kind)}</span>`:""}${ageChip(x.firstSeen)}</div><p class="title">${esc(x.title||x.text)}</p>${x.text&&x.title?`<p class="sub">${esc(x.text)}</p>`:""}<p class="sub mono">${esc(x.from||"")}${x.date?" · "+fmtDue(x.date):""}</p>${safeUrl(x.url)?`<div class="actions"><a class="btn sm" href="${safeUrl(x.url)}" target="_blank" rel="noopener">Open ↗</a></div>`:""}</div><span></span>`)).join("")}</ul></section>`;

  const oid = o => "o:"+(o.id||slug(o.title));

  const opps = live.filter(o => !on("starred", oid(o)) && !on("dismissed", oid(o)));
  const gone = live.filter(o => on("dismissed", oid(o)));
  const oppRow = o => { const id=oid(o), st=on("starred",id), ms=o.date?msUntil(o.date):null;
    return li(`<span class="icon c-moss" aria-hidden="true">${st?"★":"+"}</span><div class="body"><div class="meta">${ageChip(o.firstSeen)}</div><p class="title">${esc(o.title)}</p><p class="sub">${o.date?`<span class="mono">${fmtDue(o.date)}</span>${o.note?" · ":""}`:""}${esc(o.note||"")}</p>
      <div class="actions">${safeUrl(o.link)?`<a class="btn sm" href="${safeUrl(o.link)}" target="_blank" rel="noopener">Details ↗</a>`:""}<button class="btn sm" data-mark="starred" data-id="${esc(id)}" aria-pressed="${st}">${st?"★ Interested":"☆ Interested"}</button><button class="btn sm ghost" data-mark="dismissed" data-id="${esc(id)}">Not for me</button></div></div>${o.date?`<span class="pill ${tone(ms)==="calm"?"":tone(ms)}">${esc(rel(ms))}</span>`:"<span></span>"}`, {rowCls: st && ms!=null && ms<3*DAY ? "tone-warn":""}); };
  if(picks.length) h += `<section><h2>Your picks <small>reminding you until the date</small></h2><ul class="list">${picks.map(oppRow).join("")}</ul></section>`;
  h += `<section><h2>Opportunities</h2>${opps.length ? `<ul class="list">${opps.map(oppRow).join("")}</ul>` : none("No new talks, volunteering or field trips.")}`;
  if(gone.length) h += `<details class="more"><summary>Show ${gone.length} not for me</summary><ul class="list">${gone.map(o=>li(`<span class="icon ev">–</span><div class="body"><p class="title">${esc(o.title)}</p></div><button class="btn sm ghost" data-mark="dismissed" data-id="${esc(oid(o))}">Undo</button>`)).join("")}</ul></details>`;
  return h + `</section>`;
}

const STAGES = [["saved","Saved","forest"],["applied","Applied","sky"],["interview","Interview","ochre"],["answer","Answer","moss"]];
const jobId = j => "j:"+(j.id||slug(j.company+j.title));
function stageOf(id){ return marks.stage[id] || (on("saved",id) ? "saved" : null); }
function setStage(id, st){
  if(st){ marks.stage[id] = st; marks.stageAt[id] = Date.now(); if(!marks.saved[id]) marks.saved[id] = Date.now(); }
  else { delete marks.stage[id]; delete marks.stageAt[id]; delete marks.saved[id]; }
  saveMarks(); render();
}
function snapJob(id){ const all=[...(jobs&&jobs.fits||[]), ...(jobs&&jobs.maybe||[])]; const j = all.find(x => jobId(x)===id); if(j) marks.snap[id] = {title:j.title, company:j.company, url:j.url, location:j.location, deadline:j.deadline||""}; }
function statusTone(s){ s=String(s||"").toLowerCase(); if(/reject|declin|not selected|unsuccess/.test(s)) return "muted"; if(/action|test|assessment|document|deadline|reply/.test(s)) return "warn"; if(/interview|offer|next|shortlist/.test(s)) return "hot"; return ""; }

  return h;
}

/* ---------- scene mosaic + topo ---------- */
const RAMP = [[120,82,44],[178,140,78],[214,196,120],[166,198,98],[92,158,72],[38,110,58],[22,74,44]];
function rng(seed){ let h=2166136261; for(const c of seed) h=Math.imul(h^c.charCodeAt(0),16777619); return () => { h^=h<<13; h^=h>>>17; h^=h<<5; return ((h>>>0)%100000)/100000; }; }
function drawScene(seed){
  const cv = $("#scene-cv"); if(!cv) return;
  const r = cv.getBoundingClientRect(); if(!r.width) return;
  const dpr = Math.min(2, window.devicePixelRatio||1);
  cv.width = Math.round(r.width*dpr); cv.height = Math.round(r.height*dpr);
  const ctx = cv.getContext("2d"); if(!ctx) return;
  const rand = rng(seed), G = 7, grid = [];
  for(let i=0;i<=G;i++){ grid.push([]); for(let j=0;j<=G;j++) grid[i].push(rand()); }
  const cell = 9*dpr, cols = Math.ceil(cv.width/cell), rows = Math.ceil(cv.height/cell), fine = rng(seed+"f");
  for(let y=0;y<rows;y++) for(let x=0;x<cols;x++){
    const gx = x/cols*G, gy = y/rows*G, i=Math.floor(gx), j=Math.floor(gy), fx=gx-i, fy=gy-j;
    const sx = fx*fx*(3-2*fx), sy = fy*fy*(3-2*fy);
    const a = grid[i][j]*(1-sx)+grid[i+1][j]*sx, b = grid[i][j+1]*(1-sx)+grid[i+1][j+1]*sx;
    let v = a*(1-sy)+b*sy; v = Math.max(0, Math.min(.999, v*1.15 - .05 + (fine()-.5)*.12));
    const p = v*(RAMP.length-1), k = Math.floor(p), t = p-k, c0 = RAMP[k], c1 = RAMP[Math.min(k+1,RAMP.length-1)];
    ctx.fillStyle = `rgb(${c0.map((c,n)=>Math.round(c+(c1[n]-c)*t)).join(",")})`;
    ctx.fillRect(x*cell, y*cell, cell-0.5*dpr, cell-0.5*dpr);
  }
}
function drawTopo(){
  const svg = $("#topo"), W = 600, H = 120, rand = rng("topo"+todayKey());
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  let d = "";
  const hills = [[W*.82, H*.55, 6],[W*.18, H*.95, 5],[W*.5, -10, 4]];
  for(const [cx, cy, n] of hills){
    const ph = [rand()*6.28, rand()*6.28, rand()*6.28];
    for(let k=1;k<=n;k++){
      const base = 16*k, pts = [];
      for(let s=0;s<=48;s++){ const a = s/48*Math.PI*2; const rr = base*(1+.18*Math.sin(3*a+ph[0])+.1*Math.sin(5*a+ph[1])+.06*Math.sin(7*a+ph[2])); pts.push([cx+Math.cos(a)*rr*1.7, cy+Math.sin(a)*rr]); }
      d += "M"+pts.map(p=>p[0].toFixed(1)+" "+p[1].toFixed(1)).join("L")+"Z";
    }
  }
  svg.innerHTML = `<path d="${d}"/>`;
}

/* ---------- encrypted board data ---------- */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(pass, blob){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(blob.salt), iterations:blob.iter||250000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(blob.iv)}, key, b64(blob.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
let lastStamp = "";
async function load(pass){
  let blob;
  try { blob = await fetch("data.enc.json?t=" + Date.now(), {cache:"no-store"}).then(r => { if(!r.ok) throw new Error("fetch"); return r.json(); }); offline = false; }
  catch(e){ offline = true; const c = LS.get("fd-blob", null); if(!c) throw new Error("fetch"); blob = c; }
  if(blob.stamp && blob.stamp === lastStamp && daily) return;
  const data = await decrypt(pass, blob);
  LS.set("fd-blob", blob);
  lastStamp = blob.stamp || "";
  daily = data.daily || null; jobs = data.jobs || null; loaded = true;
  syncWords(); render();
}
function getPass(){ try { return localStorage.getItem("hub-key"); } catch(e){ return null; } }
async function refreshAll(force){
  const p = getPass();
  await Promise.allSettled([p ? load(p) : Promise.resolve(), fetchEnv(force), fetchNature(force)]);
}
async function boot(){
  const pass = getPass();
  drawTopo(); render();
  if(!pass){ $("#lock").hidden = false; return; }
  try { await load(pass); }
  catch(e){ if(e && e.message === "fetch"){ loaded = true; render(); } else { try{localStorage.removeItem("hub-key");}catch(_){} $("#lock").hidden = false; return; } }
  fetchEnv(false).then(() => { if(!busy()) render(); });
  fetchNature(false).then(() => { if(!busy()) render(); });
}
$("#lock-form").addEventListener("submit", async e => {
  e.preventDefault(); e.stopPropagation();
  const pass = $("#key").value.trim(), err = $("#lock-err");
  if(!pass){ err.textContent = "Enter your key first."; return; }
  err.textContent = "Unlocking…";
  try { await load(pass); try{ localStorage.setItem("hub-key", pass); }catch(_){} $("#lock").hidden = true; err.textContent = ""; fetchEnv(false).then(render); fetchNature(false).then(render); }
  catch(x){ err.textContent = x && x.message === "fetch" ? "Could not reach your data. Check your connection." : "That key does not match. Try again."; }
});
$("#key").addEventListener("input", () => { $("#lock-err").textContent = ""; });
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible" && getPass()) refreshAll(false).then(() => { if(!busy()) render(); }); });
window.addEventListener("resize", () => drawScene(tab + todayKey()));
setInterval(() => { if(!busy()) render(); }, 60000);
if("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
boot();
</script>
