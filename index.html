<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Alexis Hub">
<meta name="theme-color" content="#F7F5EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1511" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Alexis Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Alexis Hub · field-notebook design system
   One purpose per screen. Lists show names only; every item opens its own page.
   ========================================================= */
html{-webkit-text-size-adjust:100%}
body{margin:0}
*{box-sizing:border-box}
img{max-width:100%;display:block}
[hidden]{display:none!important}
:root{
  --bg:#F7F5EF; --surface:#FFFFFF; --surface-2:#F0ECE1; --ink:#1B2620; --ink-2:#3C4A41; --muted:#6E786F; --line:#E6E0D2; --line-2:#EFEBE1;
  --accent:#2F5D45; --accent-ink:#FFFFFF; --accent-soft:#E1EBE2;
  --ochre:#A3680D; --ochre-soft:#F6E8C9; --terra:#C24E30; --terra-soft:#F8DED4;
  --sky:#2B6E95; --sky-soft:#DCEAF2; --moss:#5A7D2C; --moss-soft:#E6EED5; --plum:#7D5280; --plum-soft:#EFE1EE;
  --topo:rgba(255,255,255,.22); --shadow:0 1px 2px rgba(27,38,32,.06),0 8px 24px -12px rgba(27,38,32,.22);
  --shadow-lg:0 2px 6px rgba(27,38,32,.08),0 18px 40px -18px rgba(27,38,32,.35);
  --f-display:"Fraunces",Georgia,serif; --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:18px; --nav-h:66px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1511; --surface:#162019; --surface-2:#1C2820; --ink:#E9ECE4; --ink-2:#C5CCC2; --muted:#93A095; --line:#26332B; --line-2:#1F2A23;
  --accent:#8CC5A0; --accent-ink:#0D1610; --accent-soft:#1E3327;
  --ochre:#E4B05A; --ochre-soft:#382B13; --terra:#F08A6C; --terra-soft:#3D2018;
  --sky:#86BCDD; --sky-soft:#152E3C; --moss:#B2CD83; --moss-soft:#263219; --plum:#D5A9D5; --plum-soft:#342235;
  --topo:rgba(255,255,255,.12); --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.8); --shadow-lg:0 18px 40px -18px rgba(0,0,0,.9); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1511; --surface:#162019; --surface-2:#1C2820; --ink:#E9ECE4; --ink-2:#C5CCC2; --muted:#93A095; --line:#26332B; --line-2:#1F2A23;
  --accent:#8CC5A0; --accent-ink:#0D1610; --accent-soft:#1E3327;
  --ochre:#E4B05A; --ochre-soft:#382B13; --terra:#F08A6C; --terra-soft:#3D2018;
  --sky:#86BCDD; --sky-soft:#152E3C; --moss:#B2CD83; --moss-soft:#263219; --plum:#D5A9D5; --plum-soft:#342235;
  --topo:rgba(255,255,255,.12); --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.8); --shadow-lg:0 18px 40px -18px rgba(0,0,0,.9); color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.c-forest{--c:var(--accent);--c-soft:var(--accent-soft)} .c-ochre{--c:var(--ochre);--c-soft:var(--ochre-soft)} .c-sky{--c:var(--sky);--c-soft:var(--sky-soft)}
.c-terra{--c:var(--terra);--c-soft:var(--terra-soft)} .c-moss{--c:var(--moss);--c-soft:var(--moss-soft)} .c-plum{--c:var(--plum);--c-soft:var(--plum-soft)}

/* ---------- page frame ---------- */
#app{max-width:560px;margin:0 auto;min-height:100vh}
.tab{padding:calc(var(--safe-t) + 18px) max(18px,env(safe-area-inset-left,0px)) calc(var(--nav-h) + var(--safe-b) + 36px);display:grid;gap:26px;align-content:start}
.tab.enter>*:not(.fab){animation:fade .35s ease both}
@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.eyebrow{margin:0 0 4px;font:500 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.big-title{margin:0;font:600 34px/1.05 var(--f-display);letter-spacing:-.02em;font-variation-settings:"opsz" 120}
.lede{margin:6px 0 0;color:var(--muted);font-size:14px}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;box-shadow:var(--shadow)}
.iconbtn svg{width:20px;height:20px}
svg.i{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sec{display:grid;gap:12px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec-h h2{margin:0;font:600 20px/1.2 var(--f-display);letter-spacing:-.01em}
.link{border:0;background:none;padding:0;color:var(--ink);font:600 14px var(--f-body);text-decoration:underline;text-underline-offset:3px}
.quiet-link{border:0;background:none;padding:0;color:var(--muted);font:500 13px var(--f-body)}

/* ---------- bottom navigation ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 94%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--safe-b))}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{position:relative;border:0;background:none;display:grid;justify-items:center;gap:3px;padding:6px 2px;color:var(--muted);font:500 10.5px var(--f-body);letter-spacing:.01em}
.nav button svg{width:24px;height:24px}
.nav button[aria-selected="true"]{color:var(--accent);font-weight:600}
.nav button[aria-selected="true"] svg{stroke-width:2.1}
.nav .badge{position:absolute;top:2px;left:calc(50% + 7px);min-width:17px;height:17px;padding:0 5px;border-radius:99px;background:var(--terra);color:#fff;font:600 10px/17px var(--f-body);text-align:center;box-shadow:0 0 0 2px var(--surface)}

/* ---------- name-only lists ---------- */
.list{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.list>li{position:relative;overflow:hidden}
.list>li+li .row{border-top:1px solid var(--line-2)}
.row{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 16px;background:var(--surface);min-height:62px;transition:transform .25s cubic-bezier(.2,.9,.2,1)}
li[data-go] .row{cursor:pointer}
li[data-go] .row:active{background:var(--surface-2)}
.row .nm{margin:0;font-weight:600;font-size:15px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row .sm{margin:2px 0 0;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .end{display:flex;align-items:center;gap:8px;color:var(--muted)}
.row .end svg{width:16px;height:16px}
.mid{min-width:0}
li.is-done .nm{text-decoration:line-through;color:var(--muted);font-weight:500}
li.is-read .nm{font-weight:500;color:var(--ink-2)}
.tag{font:500 11.5px var(--f-body);padding:4px 9px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.tag.hot{background:var(--terra-soft);color:var(--terra)} .tag.warn{background:var(--ochre-soft);color:var(--ochre)} .tag.calm{background:var(--moss-soft);color:var(--moss)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--accent));flex:none}
.circle{width:26px;height:26px;border-radius:50%;border:2px solid color-mix(in srgb,var(--c,var(--accent)) 55%,var(--line));background:transparent;display:grid;place-items:center;padding:0;flex:none;transition:background .15s,border-color .15s}
.circle svg{width:14px;height:14px;stroke:#fff;stroke-width:3;opacity:0}
.circle.on{background:var(--moss);border-color:var(--moss)}
.circle.on svg{opacity:1}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--c-soft);color:var(--c);font:600 15px var(--f-body);flex:none}
.avatar.sq{border-radius:12px}
.unread{width:8px;height:8px;border-radius:50%;background:var(--terra)}
.sw-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font:600 13px var(--f-body);background:var(--moss-soft);color:var(--moss)}
.sw-bg .l{opacity:0}
li.swipe-left .sw-bg{background:var(--terra-soft);color:var(--terra)}
li.swipe-left .sw-bg .r{opacity:0} li.swipe-left .sw-bg .l{opacity:1}
li.swipe-ok .sw-bg{background:var(--moss);color:#fff}
li.swipe-left.swipe-ok .sw-bg{background:var(--terra);color:#fff}
li[data-sr] .row,li[data-sl] .row{touch-action:pan-y}
.empty{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:26px 20px;display:grid;gap:6px;justify-items:start}
.empty .ill{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);margin-bottom:4px}
.empty .ill svg{width:24px;height:24px}
.empty b{font:600 18px/1.25 var(--f-display)}
.empty p{margin:0;color:var(--muted);font-size:14px}
.fold{display:flex;justify-content:center}
.fold button{border:0;background:none;color:var(--muted);font:500 13px var(--f-body);padding:6px 10px;border-radius:99px}
.fold button:active{background:var(--surface-2)}

/* ---------- chips ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:2px 18px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:8px 14px;font:500 13.5px var(--f-body);display:inline-flex;align-items:center;gap:7px}
.chip .n{font:600 11px var(--f-body);color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] .n{color:color-mix(in srgb,var(--bg) 70%,transparent)}

/* ---------- Today ---------- */
.wxstrip{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 16px 8px 10px;box-shadow:var(--shadow);text-align:left;width:100%}
.wxstrip .ico{width:30px;height:30px;color:var(--ochre)}
.wxstrip .ico svg{width:100%;height:100%}
.wxstrip .t{font:600 18px var(--f-display);font-variant-numeric:tabular-nums}
.wxstrip .m{flex:1;min-width:0;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wxstrip .m b{color:var(--ink);font-weight:500}
.wxstrip>svg{width:18px;height:18px;color:var(--muted);flex:none}
.hero{position:relative;overflow:hidden;border-radius:24px;min-height:218px;padding:20px;display:grid;align-content:space-between;gap:16px;background:#1E3A2B;color:#F7F5EF;box-shadow:var(--shadow-lg);border:0;text-align:left;width:100%}
.hero canvas{position:absolute;inset:0;width:100%;height:100%}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,16,11,.15) 0%,rgba(8,16,11,.55) 45%,rgba(8,16,11,.9) 100%)}
.hero>*:not(canvas){position:relative;z-index:1}
.hero .k{font:500 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.hero .t{margin:0;font:600 26px/1.12 var(--f-display);letter-spacing:-.01em;text-wrap:balance}
.hero .w{margin:6px 0 0;font-size:14px;opacity:.85}
.hero .bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.hero .big{font:700 54px/0.9 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.hero .big small{display:block;font:500 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;opacity:.8;margin-top:6px}
.hero.hot .big{color:#FFB59E}
.hdots{display:flex;gap:5px;align-items:center}
.hdots i{width:6px;height:6px;border-radius:3px;background:#fff;opacity:.4;transition:all .25s}
.hdots i.on{width:18px;opacity:1}
.hero .open{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:99px;padding:7px 12px;font:600 12.5px var(--f-body);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;overflow:hidden;border:0;text-align:left;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:15px;min-height:124px;display:grid;align-content:space-between;gap:10px}
.tile .ti{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--c-soft);color:var(--c)}
.tile .ti svg{width:20px;height:20px}
.tile .tt{font:600 15px/1.2 var(--f-body)}
.tile .ts{font-size:12.5px;color:var(--muted);margin-top:2px}
.tile .tn{position:absolute;top:14px;right:14px;font:600 22px var(--f-display);color:var(--c)}
.tile.photo{color:#fff;padding:0}
.tile.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(0,0,0,.72))}
.tile.photo .cap{position:relative;z-index:1;padding:14px;align-self:end}
.tile.photo .ts{color:rgba(255,255,255,.8)}
.calm-card{border-radius:var(--r);background:var(--accent-soft);color:var(--accent);padding:18px;display:flex;gap:14px;align-items:center}
.calm-card svg{width:28px;height:28px;flex:none}
.calm-card b{font:600 17px var(--f-display);display:block;color:var(--ink)}
.calm-card span{font-size:13.5px;color:var(--ink-2)}
.foot{color:var(--muted);font:400 11.5px var(--f-mono);text-align:center;display:flex;justify-content:center;gap:10px;align-items:center}
.foot button{border:0;background:none;color:var(--accent);font:500 11.5px var(--f-mono);padding:0}
.offline{font:500 12.5px var(--f-body);color:var(--ochre);background:var(--ochre-soft);border-radius:12px;padding:10px 14px}

/* ---------- Plan / calendar ---------- */
.cal{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:14px 12px 12px}
.cal-h{display:flex;justify-content:space-between;align-items:center;padding:2px 6px 12px}
.cal-h b{font:600 19px var(--f-display)}
.cal-h .arrows{display:flex;gap:6px}
.cal-h .arrows button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.cal-h .arrows svg{width:16px;height:16px}
.cal-wd,.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-wd span{text-align:center;font:500 10.5px var(--f-mono);letter-spacing:.06em;color:var(--muted);padding-bottom:6px}
.cal-d{position:relative;aspect-ratio:1/1.06;border:0;background:transparent;border-radius:14px;display:grid;place-items:center;align-content:center;gap:3px;padding:0;font:500 14.5px var(--f-body);font-variant-numeric:tabular-nums;color:var(--ink)}
.cal-d.out{color:color-mix(in srgb,var(--muted) 55%,transparent)}
.cal-d.has{background:var(--c-soft);color:var(--c);font-weight:700}
.cal-d .ds{display:flex;gap:2.5px;height:5px}
.cal-d .ds i{width:5px;height:5px;border-radius:50%;background:var(--c)}
.cal-d.today{box-shadow:inset 0 0 0 2px var(--ink)}
.cal-d.sel{background:var(--ink);color:var(--bg)}
.cal-d.sel .ds i{background:var(--bg)}
.cal-d.past.has{opacity:.75}
.day-h{display:flex;justify-content:space-between;align-items:baseline}
.day-h h2{margin:0;font:600 20px var(--f-display)}
.day-h span{font:500 12px var(--f-mono);color:var(--muted)}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(var(--nav-h) + var(--safe-b) + 16px);z-index:19;width:58px;height:58px;border-radius:50%;border:0;background:var(--terra);color:#fff;display:grid;place-items:center;box-shadow:0 10px 26px -8px rgba(194,78,48,.65)}
.fab svg{width:26px;height:26px;stroke-width:2.2}
.overdue{display:flex;align-items:center;gap:10px;background:var(--terra-soft);color:var(--terra);border-radius:14px;padding:11px 14px;font:500 13.5px var(--f-body);border:0;width:100%;text-align:left}

/* ---------- Projects ---------- */
.pcard{position:relative;overflow:hidden;border:0;width:100%;text-align:left;border-radius:24px;background:var(--surface);box-shadow:var(--shadow);padding:0;display:grid}
.pcard .pc{position:relative;height:108px;background:var(--c);overflow:hidden}
.pcard .pc svg.topo{position:absolute;inset:0;width:100%;height:100%}
.pcard .pc .pk{position:absolute;left:18px;bottom:14px;color:#fff;font:500 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;opacity:.9}
.pcard .pb{padding:16px 18px 18px;display:flex;justify-content:space-between;align-items:center;gap:14px}
.pcard .pt{margin:0;font:600 21px/1.15 var(--f-display)}
.pcard .ps{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.ring{position:relative;width:62px;height:62px;flex:none;color:var(--c)}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .trk{stroke:var(--c-soft)}
.ring .val{stroke:currentColor;stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.2,.9,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:600 15px var(--f-body);color:var(--ink)}
.minibars{display:flex;gap:4px;align-items:flex-end;height:44px}
.minibars i{width:9px;border-radius:3px;background:var(--c);opacity:.35;min-height:3px}
.minibars i:last-child{opacity:1}

/* ---------- detail pages ---------- */
.detail{min-height:100vh;padding-bottom:calc(98px + var(--safe-b));background:var(--bg)}
.detail.enter>.cover,.detail.enter>.sheet{animation:slide .32s cubic-bezier(.2,.9,.2,1) both}
@keyframes slide{from{opacity:.5;transform:translateX(26px)}to{opacity:1;transform:none}}
.cover{position:relative;height:calc(230px + var(--safe-t));background:var(--c,var(--accent));overflow:hidden;color:#fff}
.cover svg.topo{position:absolute;inset:0;width:100%;height:100%}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover.img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 40%)}
.cover .glyph{position:absolute;right:22px;bottom:44px;font:700 88px/1 var(--f-display);opacity:.18;letter-spacing:-.04em}
.back{position:absolute;z-index:3;top:calc(var(--safe-t) + 14px);left:16px;width:40px;height:40px;border-radius:50%;border:0;background:var(--surface);color:var(--ink);display:grid;place-items:center;box-shadow:var(--shadow-lg)}
.back svg{width:18px;height:18px;stroke-width:2.2}
.cover-r{position:absolute;z-index:3;top:calc(var(--safe-t) + 14px);right:16px;display:flex;gap:8px}
.cover-r button{width:40px;height:40px;border-radius:50%;border:0;background:var(--surface);color:var(--ink);display:grid;place-items:center;box-shadow:var(--shadow-lg)}
.cover-r svg{width:18px;height:18px}
.sheet{position:relative;margin-top:-26px;background:var(--bg);border-radius:26px 26px 0 0;padding:26px max(20px,env(safe-area-inset-left,0px)) 10px;display:grid;gap:22px;max-width:560px}
.sheet h1{margin:0;font:600 28px/1.15 var(--f-display);letter-spacing:-.015em;text-wrap:balance}
.sheet h1.long{font:600 19px/1.5 var(--f-body);letter-spacing:0;text-wrap:pretty}
.blk p.read{font-size:16px;line-height:1.7;color:var(--ink)}

/* swipe rows (right = done/read/save, left = hide) + pull to refresh */
let sw = null, ptr = null;
document.addEventListener("touchstart", e => {
  const p = e.touches[0];
  if(window.scrollY <= 0 && TABS.includes(route.page) && !e.target.closest(".chips,.board,.lock,textarea,input")) ptr = {y:p.clientY, dy:0};
  const l = e.target.closest("li[data-sr],li[data-sl]");
  if(!l || e.target.closest("button,input,a")) return;
  sw = {l, row:l.querySelector(".row"), x:p.clientX, y:p.clientY, dx:0, lock:null};
}, {passive:true});
document.addEventListener("touchmove", e => {
  const p = e.touches[0];
  if(ptr){ ptr.dy = p.clientY - ptr.y; if(ptr.dy > 6 && (!sw || sw.lock !== "x")) showPtr(Math.min(90, ptr.dy*.5), false); }
  if(!sw) return; const dx = p.clientX - sw.x, dy = p.clientY - sw.y;
  if(!sw.lock){ if(Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) sw.lock = "x"; else if(Math.abs(dy) > 10) sw.lock = "y"; }
  if(sw.lock !== "x") return;
  if(ptr){ ptr = null; showPtr(0, false); }
  sw.dx = sw.l.dataset.sl ? dx : Math.max(0, dx); if(!sw.l.dataset.sr) sw.dx = Math.min(0, sw.dx);
  sw.row.style.transition = "none"; sw.row.style.transform = `translateX(${sw.dx}px)`;
  sw.l.classList.toggle("swipe-left", sw.dx < 0); sw.l.classList.toggle("swipe-ok", Math.abs(sw.dx) > 90);
}, {passive:true});
document.addEventListener("touchend", () => {
  if(ptr){ const goR = ptr.dy*.5 > 60; ptr = null; if(goR){ showPtr(56, true); refreshAll(true).finally(() => { showPtr(0, false); render(); }); } else showPtr(0, false); }
  if(!sw) return; const s = sw; sw = null; s.row.style.transition = "";
  if(s.lock === "x") swiped = Date.now();
  if(s.lock === "x" && Math.abs(s.dx) > 90){
    s.row.style.transform = `translateX(${s.dx > 0 ? "" : "-"}110%)`;
    const [act, id] = (s.dx > 0 ? s.l.dataset.sr : s.l.dataset.sl).split(/:(.+)/);
    setTimeout(() => {
      if(act==="done") setMark("done", id, true);
      else if(act==="read"){ const m = mailItems().find(x => x.id === id); if(m && m.type==="reply") setMark("done", id, true); else setMark("read", id, true); }
      else if(act==="save"){ if(!stageOf(id)) setStage(id, "saved"); }
      else if(act==="hide") setMark("hidden", id, true);
      render();
    }, 180);
  } else { s.row.style.transform = ""; s.l.classList.remove("swipe-ok","swipe-left"); }
});

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(pass, blob){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(blob.salt), iterations:blob.iter||250000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(blob.iv)}, key, b64(blob.ct))));
}

async function load(pass){
  let blob;
  try { blob = await fetch("data.enc.json?t="+Date.now(), {cache:"no-store"}).then(r => { if(!r.ok) throw new Error("fetch"); return r.json(); }); offline = false; }
  catch(e){ offline = true; blob = LS.get("fd-blob", null); if(!blob) throw new Error("fetch"); }
  if(blob.stamp && blob.stamp === lastStamp && daily) return false;
  const data = await decrypt(pass, blob); LS.set("fd-blob", blob); lastStamp = blob.stamp || "";
  daily = data.daily || null; jobs = data.jobs || null; loaded = true; importReminders(data.reminders); syncWords(); backfillLog(); if(!busy()) render(); return true;
}
const getPass = () => { try { return localStorage.getItem("hub-key"); } catch(e){ return null; } };
async function refreshAll(force){
  const p = getPass();
  const [b] = await Promise.allSettled([p ? load(p) : Promise.resolve(false), fetchEnv(force), fetchNature(force)]);
  const hh = new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
  if(force) refreshNote = {t:Date.now(), msg: b.status==="rejected" ? "Couldn't reach the board · "+hh : offline ? "Offline · saved board" : b.value ? "New board loaded ✓ · "+hh : "Up to date · checked "+hh};
}
async function boot(){
  route = parseHash(); history.replaceState({r:route}, "", hashOf(route));
  render();
  const pass = getPass(); if(!pass){ $("#lock").hidden = false; return; }
  try { await load(pass); } catch(e){ if(e && e.message === "fetch"){ loaded = true; render(); } else { try{ localStorage.removeItem("hub-key"); }catch(_){} $("#lock").hidden = false; return; } }
  fetchEnv(false).then(() => { if(!busy()) render(); });
  fetchNature(false).then(() => { if(!busy()) render(); });
}
$("#lock-form").addEventListener("submit", async e => {
  e.preventDefault(); e.stopPropagation();
  const pass = $("#key").value.trim(), err = $("#lock-err"); if(!pass){ err.textContent = "Enter your key first."; return; }
  err.textContent = "Unlocking…";
  try { await load(pass); try{ localStorage.setItem("hub-key", pass); }catch(_){} $("#lock").hidden = true; err.textContent = ""; fetchEnv(false).then(render); fetchNature(false).then(render); }
  catch(x){ err.textContent = x && x.message === "fetch" ? "Could not reach your data. Check your connection." : "That key does not match. Try again."; }
});
$("#key").addEventListener("input", () => { $("#lock-err").textContent = ""; });
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible" && getPass()) refreshAll(false).then(() => { if(!busy()) render(); }); });
window.addEventListener("resize", () => drawScene($("#scene-cv"), "hero"+todayKey()+heroIdx));
setInterval(() => { if(!busy()) render(); }, 60000);
if("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
boot();
</script>
